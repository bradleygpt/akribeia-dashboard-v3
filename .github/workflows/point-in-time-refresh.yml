name: Point-in-time observation refresh

# Ingest the newest V2 point-in-time observation (nightly bake published to the
# commit-pinned bulk data repository), rebuild the evidence chain against it,
# and open a reviewable pull request only when the full repository gate passes.
# Fail-closed: an already-observed bake is a successful no-op, and byte-identical upstream
# data on a later bake date is recorded as a no-new-upstream-data day (no build); any fetch, receipt,
# generation, or validation failure blocks the refresh without a commit.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 2-6"

concurrency:
  group: point-in-time-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No job-wide GH_TOKEN (audit 2026-10-20, E7): only the PR step needs a token for gh, and
    # it sets its own. npm ci and the test suite no longer run with one in their environment.
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The newest V2 bake commit carries meta.json plus the akribeia-data commit (and
      # per-file digests) V2 serves, so the ingest reads everything pinned to it. The
      # deployed V2 app is not a source: it answers HTTP 402 DEPLOYMENT_DISABLED since
      # 2026-10-14, which failed every run until this step stopped depending on it.
      - name: Resolve the newest V2 bake commit
        id: source
        shell: bash
        run: |
          v2_commit=$(git ls-remote https://github.com/bradleygpt/quant-dashboard-pro-v2.git HEAD | cut -f1)
          if [[ ! "$v2_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the V2 HEAD commit." >&2
            exit 1
          fi
          echo "v2_commit=$v2_commit" >> "$GITHUB_OUTPUT"

      - name: Ingest the current observation
        id: ingest
        shell: bash
        # The ingest states its disposition on stdout (owner decision 2026-10-20, audit E3):
        #   ingested             new upstream data: rebuild the chain and open a refresh PR
        #   no-new-upstream-data a later bake date over byte-identical universe files: no
        #                        build; a visible stall record that adds nothing to the
        #                        prospective count or maturity gates, in its own small PR
        #   already-observed     the same bake again: a no-op
        # In September, 11 refresh PRs carried identical data as new observation dates.
        run: |
          before_build=$(node -p 'JSON.parse(require("node:fs").readFileSync("data/preview/vertical-slice-build.json","utf8")).buildId')
          node scripts/ingest-v2-observation.node.mjs --v2-commit "${{ steps.source.outputs.v2_commit }}" | tee "$RUNNER_TEMP/ingest.json"
          disposition=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).disposition' "$RUNNER_TEMP/ingest.json")
          after_build=$(node -p 'JSON.parse(require("node:fs").readFileSync("data/preview/vertical-slice-build.json","utf8")).buildId')
          echo "before_build=$before_build" >> "$GITHUB_OUTPUT"
          echo "after_build=$after_build" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          case "$disposition" in
            ingested) ;;
            no-new-upstream-data)
              echo "::notice::No new upstream data: every universe partition is byte-identical to the active observation ($before_build). Recorded as a no-new-upstream-data day; it adds nothing to the prospective count." ;;
            already-observed) ;;
            *) echo "Unknown ingest disposition: $disposition" >&2; exit 1 ;;
          esac

      - name: Stop on an unchanged observation
        if: steps.ingest.outputs.disposition == 'already-observed'
        shell: bash
        run: |
          echo "## Point-in-time refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No new observation: this bake is already observed (no-op)." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the no-new-upstream-data record
        if: steps.ingest.outputs.disposition == 'no-new-upstream-data'
        run: |
          npm run ci
          git diff --check

      # Same token caveat as the refresh PR below: until REFRESH_PR_TOKEN is set, this PR's
      # checks wait for manual approval.
      - name: Open a no-new-upstream-data pull request
        if: steps.ingest.outputs.disposition == 'no-new-upstream-data'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
        run: |
          observation_date=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).observationDate' "$RUNNER_TEMP/ingest.json")
          echo "## Point-in-time refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No new upstream data on ${observation_date}: not an observation day." >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "The ${observation_date} stall is already recorded on main."
            exit 0
          fi
          branch="automation/no-new-upstream-data-${observation_date}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request branch for the ${observation_date} stall already exists."
            exit 0
          fi

          git config user.name "akribeia-observation-bot"
          git config user.email "akribeia-observation-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git diff --cached --check
          git commit -m "data: no new upstream data ${observation_date}"
          git push --set-upstream origin "$branch"

          pr_body="$RUNNER_TEMP/no-new-upstream-data-pr-body.md"
          cat > "$pr_body" <<'BODY'
          ## Summary

          - V2 baked on a new date, but every universe partition is byte-identical to the active observation's
          - records a visible no-new-upstream-data day under data/evidence/upstream-stalls/ and its dashboard projection
          - publishes no build and adds nothing to the prospective count or the maturity gates

          ## Validation

          - full repository CI passed
          - whitespace validation passed
          BODY

          gh pr create \
            --base main \
            --head "$branch" \
            --title "data: no new upstream data ${observation_date}" \
            --body-file "$pr_body"

      - name: Capture the SEC submissions snapshot
        if: steps.ingest.outputs.disposition == 'ingested'
        shell: bash
        run: |
          if [[ -z "$SEC_USER_AGENT" ]]; then
            echo "SEC_USER_AGENT secret is required for the submissions snapshot." >&2
            exit 1
          fi
          snapshot_id=$(date -u +%F)
          echo "SEC_SNAPSHOT_ID=$snapshot_id" >> "$GITHUB_ENV"
          # The pipeline build must exist before the SEC capture selects CIKs.
          npm run preview:generate
          npm run evidence:generate
          npm run governance:generate
          npm run quality:generate
          npm run master:generate
          npm run registrants:generate
          SEC_SNAPSHOT_ID="$snapshot_id" npm run filing-sources:fetch

      - name: Regenerate the dependent evidence chain
        if: steps.ingest.outputs.disposition == 'ingested'
        shell: bash
        run: |
          SEC_SNAPSHOT_ID="$SEC_SNAPSHOT_ID" npm run filing-availability:generate
          npm run historical-readiness:generate
          npm run universe-membership:generate
          npm run corporate-actions:generate
          npm run exit-disposition:generate
          npm run execution-costs:generate
          npm run benchmark-readiness:generate
          npm run walk-forward-readiness:generate
          npm run prospective-readiness:generate
          npm run maturity:generate
          # Bank the day's immutable alpha-decay rank vintage from the freshly
          # published active build (duplicate dates are a clean no-op).
          npm run alpha-decay:collect

      - name: Validate the refreshed build
        if: steps.ingest.outputs.disposition == 'ingested'
        run: |
          npm run ci
          npm run security:audit
          git diff --check

      # THESE PRs REQUIRE MANUAL MERGE, AND CANNOT BE AUTO-MERGED ON GREEN YET.
      #
      # `gh pr create` below authenticates with GITHUB_TOKEN. GitHub's recursive-workflow
      # prevention means a PR opened with that token does NOT trigger `on: pull_request`
      # workflows: CI and CodeQL are recorded against the head SHA as `action_required`,
      # awaiting a maintainer's approval, and the PR's own check rollup stays EMPTY. The
      # PR therefore reports mergeable=MERGEABLE with mergeStateStatus=UNSTABLE and zero
      # check runs, which is not "green" -- it is "never tested". Observed across all 14
      # PRs open on 2026-09-30 (#55-#68): 0 check runs on every head SHA.
      #
      # Consequence: auto-merge-on-green can never fire here, because nothing ever turns
      # green on its own. Worse, adding CI to branch protection as a required check would
      # make every refresh PR permanently unmergeable rather than merely unverified.
      #
      # UNBLOCKING IT needs a REFRESH_PR_TOKEN repo secret -- a fine-grained PAT (or a
      # GitHub App token) scoped to this repository with Contents: RW and Pull requests:
      # RW, and deliberately NOT Workflows. It is wired in below with a fallback to
      # github.token, so the step works either way; once the secret exists, confirm CI
      # runs on the next bot PR without approval, then enable auto-merge. As of
      # 2026-10-20 the secret is still absent from this repo (only SEC_USER_AGENT), so
      # every PR this workflow opens must be reviewed and merged by hand until it is set.
      - name: Open a reviewable refresh pull request
        if: steps.ingest.outputs.disposition == 'ingested'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
          HAS_REFRESH_PR_TOKEN: ${{ secrets.REFRESH_PR_TOKEN != '' }}
        run: |
          if [[ "$HAS_REFRESH_PR_TOKEN" != "true" ]]; then
            echo "::warning::REFRESH_PR_TOKEN is not set: this PR is opened with github.token, so CI and CodeQL will wait for manual approval."
          fi
          build_id='${{ steps.ingest.outputs.after_build }}'
          observation_date=$(node -p 'JSON.parse(require("node:fs").readFileSync("data/observations/current/provenance.json","utf8")).observed_at.slice(0,10)')
          branch="automation/point-in-time-refresh-${observation_date}-${GITHUB_RUN_ID}"

          git config user.name "akribeia-observation-bot"
          git config user.email "akribeia-observation-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git diff --cached --check
          git commit -m "data: point-in-time observation refresh ${observation_date} (${build_id})"
          git push --set-upstream origin "$branch"

          pr_body="$RUNNER_TEMP/point-in-time-refresh-pr-body.md"
          cat > "$pr_body" <<'BODY'
          ## Summary

          - ingests the newest V2 point-in-time observation with a commit-pinned receipt
          - rebuilds the immutable evidence build and every dependent governed artifact
          - captures a fresh SEC submissions snapshot for the selected active-company CIKs
          - leaves the immutable V2-to-V3 parity fixtures untouched

          ## Validation

          - full repository CI passed
          - dependency audit passed at high severity
          - whitespace validation passed

          ## Safety

          This automated pull request does not deploy production, alter V2, fabricate market data, or claim investment performance.
          BODY

          gh pr create \
            --base main \
            --head "$branch" \
            --title "data: point-in-time observation refresh ${observation_date}" \
            --body-file "$pr_body"
